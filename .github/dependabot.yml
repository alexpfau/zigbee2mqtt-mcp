version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Types must track the oldest Node in `engines` (22), not the newest
      # release, or the compiler stops catching use of APIs that minimum lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node majors never reach LTS, so an automatic major bump can
      # land the image on a line that is already end-of-life. Bump by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
