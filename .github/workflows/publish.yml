name: Publish

# Publishes to npm via trusted publishing (OIDC). No NPM_TOKEN secret is needed:
# npm exchanges the workflow's short-lived OIDC token for a scoped publish token.
# The trusted publisher on npmjs.com must reference this exact filename.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - run: npm run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Verify the tarball carries no local network details
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -rIqE '(^|[^0-9])(10\.255\.255\.255|private-registry\.invalid)' dist README.md; then
            echo "Refusing to publish: build output references a private host" >&2
            exit 1
          fi

      - run: npm publish

      - name: Publish to the MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          version="${GITHUB_REF_NAME#v}"
          # Keep server.json in lockstep with the tag rather than by hand.
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
