name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # No MQTT broker in CI. The server must still start and serve tools/list
      # so clients and directory scanners can introspect it unconfigured.
      - name: Startup contract
        run: |
          out="$(node dist/index.js 2>&1 < /dev/null || true)"
          echo "$out"
          echo "$out" | grep -q "Z2M_MQTT_URL is not set"
