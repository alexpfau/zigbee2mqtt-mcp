name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      # No MQTT broker in CI. The server must still start and serve tools/list
      # so clients and directory scanners can introspect it unconfigured.
      - name: Startup contract
        run: |
          out="$(node dist/index.js 2>&1 < /dev/null || true)"
          echo "$out"
          echo "$out" | grep -q "Z2M_MQTT_URL is not set"

  # The README tells people to run the image, so the image has to be built and
  # exercised here. Nothing else in CI touches the Dockerfile.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t zigbee2mqtt-mcp:ci .

      - name: Runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id zigbee2mqtt-mcp:ci -u)"
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi

      - name: Ships no source, tests or dev dependencies
        run: |
          docker run --rm --entrypoint sh zigbee2mqtt-mcp:ci -c '
            for p in /app/src /app/test /app/dist-test /app/tsconfig.json /app/node_modules/typescript; do
              if [ -e "$p" ]; then echo "unexpected in image: $p"; exit 1; fi
            done
            echo "runtime layer is clean"
          '

      - name: Startup contract
        run: |
          out="$(docker run --rm -i zigbee2mqtt-mcp:ci < /dev/null 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Z2M_MQTT_URL is not set"

      - name: Serves tools/list without a broker
        run: |
          # stdin must stay open past the reply; EOF shuts the server down.
          out="$( { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5; } \
            | docker run --rm -i zigbee2mqtt-mcp:ci 2>/dev/null )"
          count="$(printf '%s' "$out" | grep -o '"name":"z2m_[a-z_]*"' | sort -u | wc -l)"
          echo "tools advertised: $count"
          if [ "$count" -lt 15 ]; then
            echo "::error::image did not serve a usable tool list"
            printf '%s\n' "$out" | head -5
            exit 1
          fi

      - name: Report image size
        run: docker image ls zigbee2mqtt-mcp:ci --format '{{.Size}}'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # A lockfile generated behind a corporate proxy pins private feed URLs and
      # downgrades integrity hashes to sha1, which nobody outside can install.
      - name: Lockfile resolves from the public registry
        run: |
          if grep -o '"resolved": "[^"]*"' package-lock.json | grep -v 'https://registry.npmjs.org/'; then
            echo "::error::package-lock.json references a non-public registry"
            exit 1
          fi
          if grep -q '"integrity": "sha1-' package-lock.json; then
            echo "::error::package-lock.json contains sha1 integrity hashes"
            exit 1
          fi
      # Only runtime dependencies ship to users, so a dev-only advisory should
      # not block a release, but it is still worth surfacing in the log.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit || true
